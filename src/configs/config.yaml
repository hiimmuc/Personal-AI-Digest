delivery:
    telegram_enabled: true
    github_pages_repo: hiimmuc/ai-digest-daily
    daily_time_utc: "10:00+07:00"
    weekly_day: Sunday

github_trending:
    enabled: true
    since: daily # daily | weekly | monthly
    languages:
        - "" # "" = all languages
        - python
        - jupyter-notebook
    relevance_cutoff: 3 # drop repos below this LLM score
    max_repos: 15 # cap before LLM calls (post keyword-match)
    # Additional keywords for GitHub repo name/description matching
    # (merged with arxiv topic_interests + interests for Stage 1 filter)
    keywords:
        - llm
        - rag
        - agents
        - transformer
        - diffusion
        - embedding
        - vector
        - chatbot
        - fine-tuning
        - deep learning
        - multimodal

site:
    title: "AI Digest"
    sort_default: recent # recent | relevance
