arxiv:
    # ArXiv subject categories — RSS-based global trend discovery
    categories:
        - cs.AI
        - cs.LG
        - cs.RO
        - cs.CV
        - cs.CL
        - cs.HC

    # User interest topics — keyword search–based personalized discovery
    topic_interests:
        - Multi-Agent Systems
        - Embodied AI
        - Vision-Language Models
        - 3D Scene Graph
        - Vision-Language Navigation
        - Human-Computer Interaction

    max_papers_per_day: 20
    max_topic_papers: 10 # cap per interest topic
    days_back: 3 # only include papers published within this many days
    relevance_cutoff: 2 # drop papers below this score
    # hindex_cutoff: 10 # Semantic Scholar h-index prefilter (experimental, not currently used)
    author_watchlist: configs/authors.txt
    interests: >
        AI, machine learning, large language models, computer vision,
        robotics, reinforcement learning, multimodal learning,
        foundation models, generative models, Human-Computer Interaction, AI safety, Agentic AI, MLOps, NLP, speech, computing systems, general

topic_categories:
    - LLM
    - Computer Vision
    - Robotics
    - RL
    - MLOps
    - NLP
    - Speech
    - AI Safety
    - Agentic AI
    - Computing Systems
    - General

news:
    relevance_cutoff: 3
    sources:
