name: Weekly Rollup

on:
    schedule:
        - cron: "0 20 * * 0" # Sunday 20:00 UTC
    workflow_dispatch:

permissions:
    contents: write

jobs:
    run:
        runs-on: self-hosted

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  ref: dev
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run weekly rollup
              env:
                  VLLM_ENDPOINT: ${{ secrets.VLLM_ENDPOINT }}
                  VLLM_MODEL: ${{ secrets.VLLM_MODEL }}
                  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
                  AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
                  AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
                  SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python weekly_main.py

            - name: Deploy to GitHub Pages
              run: |
                  git config user.name "digest-bot"
                  git config user.email "bot@noreply"
                  git add docs/
                  git diff --staged --quiet || git commit -m "weekly rollup: week $(date +%V)"
                  git push origin dev
