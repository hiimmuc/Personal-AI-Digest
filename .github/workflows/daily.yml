name: Daily Digest

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    run:
        runs-on: self-hosted
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  ref: dev
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run daily pipeline
              env:
                  VLLM_ENDPOINT: ${{ secrets.VLLM_ENDPOINT }}
                  VLLM_MODEL: ${{ secrets.VLLM_MODEL }}
                  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
                  AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
                  AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
                  SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python -m src.main

            - name: Commit generated content
              run: |
                  git config user.name "digest-bot"
                  git config user.email "bot@noreply"
                  git add -f site/
                  git diff --staged --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
                  git push origin dev

            - name: Delete old Pages artifacts
              uses: actions/github-script@v7
              with:
                  script: |
                      const artifacts = await github.rest.actions.listArtifactsForRepo({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                      });
                      const pages = artifacts.data.artifacts.filter(a => a.name === 'github-pages');
                      for (const artifact of pages) {
                        await github.rest.actions.deleteArtifact({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          artifact_id: artifact.id,
                        });
                      }

            - name: Install Jekyll dependencies
              run: bundle install --path vendor/bundle
              working-directory: site

            - name: Build Jekyll site
              run: bundle exec jekyll build
              working-directory: site

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site/_site

    deploy:
        needs: run
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
