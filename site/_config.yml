title: "AI Digest"
description: "Personal daily AI & tech research digest"
url: "https://hiimmuc.github.io"
baseurl: "/ai-digest-daily"

# Author
author:
    name: "hiimmuc"

# GitHub
github:
    repo_url: "https://github.com/hiimmuc/ai-digest-daily"

# Theme — custom modern layout (no remote theme needed for modern pages)
# Keep remote_theme as fallback for any pages still using 'single' layout
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

sass:
    quiet_deps: true

# Plugins
plugins:
    - jekyll-feed
    - jekyll-sitemap
    - jekyll-paginate
    - jekyll-remote-theme
    - jekyll-include-cache

# Collections
collections:
    weekly:
        output: true
        permalink: /weekly/:name/

# Defaults
defaults:
    - scope:
          path: ""
          type: posts
      values:
          layout: modern
    - scope:
          path: "_pages"
          type: pages
      values:
          layout: modern
    - scope:
          path: ""
          type: weekly
      values:
          layout: modern

# Navigation (used by modern layout sidebar/footer)
header:
    links:
        - title: "Archive"
          url: /archive/
        - title: "Papers"
          url: /papers/
        - title: "News"
          url: /news/
        - title: "Repos"
          url: /trending/
        - title: "Weekly"
          url: /weekly/

# Pages
include:
    - _pages

# Exclude from build
exclude:
    - Gemfile
    - Gemfile.lock
    - "*.gem"
    - vendor/
